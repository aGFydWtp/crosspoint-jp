[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

; バージョンはここでは持たない。git tag が唯一の情報源で、
; scripts/git_branch.py が全環境の CROSSPOINT_VERSION を組み立てる。
; リリースは Actions の "Release (dispatch)" から実行する。

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
; missingInclude is suppressed alongside missingIncludeSystem: with
; custom_sdkconfig the framework is built from ESP-IDF sources, and pio check
; cannot reconstruct that include path, so every project header resolves to a
; [low:information] "not found" (400+ of them). They say nothing about the code
; — real defects still fail the build via --fail-on-defect low.
check_flags = --enable=all --suppress=missingInclude --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# Increase PNG scanline buffer to support up to 2048px wide images
# Default is (320*4+1)*2=2562, we need more for larger images
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions
# Size optimization flags (CJK: needed to prevent boot loop with large CJK fonts)
  -Os
  -ffunction-sections
  -fdata-sections
  -Wl,--gc-sections

build_unflags =
  -std=gnu++11
  -fexceptions

; mbedTLS ships with symmetric 16KB TLS record buffers, so every handshake needs
; two 16KB *contiguous* blocks. On this device (no PSRAM, one 48KB framebuffer)
; the heap is fragmented enough by the time a network activity runs that the
; second block cannot be allocated: the Aozora author listing failed with
; ESP_ERR_HTTP_CONNECT at heap=61KB / largest-block=20KB.
;
; A client only ever *sends* small requests, so the outgoing record can be much
; smaller than the incoming one. 4KB out fits every request this firmware makes
; (the longest is GitHub's signed CDN redirect at 700-900 bytes) and drops the
; contiguous requirement from 16+16KB to 16+4KB.
;
; NOTE: setting custom_sdkconfig makes pioarduino rebuild ESP-IDF from source
; instead of using the prebuilt libs, so the first build after a clean checkout
; is much slower.
custom_sdkconfig =
  CONFIG_MBEDTLS_ASYMMETRIC_CONTENT_LEN=y
  CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
  CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096

; Managed components that the Arduino package pulls in but this firmware never
; uses. They are dead weight on the prebuilt-lib path; on the from-source path
; that custom_sdkconfig forces, the RainMaker/Insights family actively breaks
; the build — their CMake embeds certificate files (https_server.crt,
; rmaker_mqtt_server.crt) that the project is expected to supply.
;
; esp-dsp goes too: its only consumer here was PNGdec's s3_simd_rgb565.S, which
; scripts/patch_pngdec.py now restricts to the ESP32-S3 it was written for.
custom_component_remove =
  espressif/esp_rainmaker
  espressif/rmaker_common
  espressif/esp_insights
  espressif/esp_diagnostics
  espressif/esp_diag_data_store
  espressif/network_provisioning
  espressif/esp-zigbee-lib
  espressif/esp-zboss-lib
  espressif/esp-modbus
  espressif/esp-dsp
  espressif/cbor
  espressif/qrcode

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/check_cjk_ui_font.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  pre:scripts/patch_pngdec.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://open-x4-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://open-x4-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://open-x4-sdk/libs/display/EInkDisplay
  SDCardManager=symlink://open-x4-sdk/libs/hardware/SDCardManager
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ ^1.0.0
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py (includes branch + short SHA)
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds
custom_i18n_languages = ENGLISH, JAPANESE


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is set by scripts/git_branch.py from the git tag
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release builds
custom_i18n_languages = ENGLISH, JAPANESE
